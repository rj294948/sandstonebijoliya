<style>
/* ===== VARIABLES ===== */
:root {
  --primary: #c7a97b;
  --bg-dark: #0a0a0a;
  --bg-card: #151515;
  --text-light: #ffffff;
  --text-muted: #888888;
  --border-color: #222222;
  --transition: all 0.3s ease;
  --font-head: 'Oswald', sans-serif;
  --font-body: 'Montserrat', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font-body);
  color: var(--text-light);
  background: var(--bg-dark);
  overflow-x: hidden;
}

/* ===== TOP NAVIGATION (Replaced Sidebar) ===== */
.top-navbar {
  position: sticky;
  top: 0;
  width: 100%;
  background: rgba(10, 10, 10, 0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border-color);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 30px;
  height: 70px;
}

.nav-brand {
  font-family: var(--font-head);
  font-size: 1.5rem;
  font-weight: 700;
  color: white;
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.nav-brand span { color: var(--primary); }
.nav-brand img { height: 35px; }

.nav-links {
  display: flex;
  gap: 25px;
}
.nav-links a {
  color: var(--text-muted);
  text-decoration: none;
  font-size: 0.85rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  transition: var(--transition);
}
.nav-links a:hover, .nav-links a.active { color: var(--primary); }

.nav-actions {
  display: flex;
  align-items: center;
  gap: 15px;
}

/* Auth Buttons & Profile in Navbar */
.btn {
  padding: 8px 18px;
  border-radius: 0;
  font-family: var(--font-head);
  font-size: 0.85rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 1px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  text-decoration: none;
}
.btn-primary { background: var(--primary); color: #000; }
.btn-primary:hover { background: transparent; border-color: var(--primary); color: var(--primary); }
.btn-outline { background: transparent; border: 1px solid var(--text-muted); color: var(--text-light); }
.btn-outline:hover { border-color: var(--primary); color: var(--primary); }

.user-info {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
}
.user-avatar {
  width: 35px; height: 35px;
  background: var(--primary); color: #000;
  display: flex; justify-content: center; align-items: center;
  font-family: var(--font-head); font-weight: 700; border-radius: 50%;
}
.user-name { font-size: 0.85rem; font-weight: 600; color: white; }

.mobile-toggle {
  display: none; background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer;
}

/* ===== NEW HERO & INFINITE HIGHLIGHT SCROLL ===== */
.hero-section {
  padding: 40px 0 20px;
  border-bottom: 1px solid var(--border-color);
  overflow: hidden;
}

.highlight-marquee {
  display: flex;
  width: max-content;
  animation: scrollMarquee 30s linear infinite;
}
.highlight-marquee:hover { animation-play-state: paused; }

@keyframes scrollMarquee {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

.highlight-item {
  width: 300px;
  height: 400px;
  margin: 0 10px;
  overflow: hidden;
  border: 1px solid var(--border-color);
  background: var(--bg-card);
}
.highlight-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: grayscale(15%) contrast(1.1);
  transition: transform 0.8s ease, filter 0.8s ease;
}
.highlight-item:hover img {
  transform: scale(1.05);
  filter: grayscale(0%) contrast(1.2);
}

/* ===== FILTERS ===== */
.filter-toggle { text-align: center; margin: 30px 0 10px; }
.filter-container {
  display: none; flex-wrap: wrap; justify-content: center; gap: 15px;
  margin: 15px 20px; padding: 25px;
  background: var(--bg-card); border: 1px solid var(--border-color);
}
.filter-container.active { display: flex; }
.filter-box { display: flex; flex-direction: column; gap: 8px; flex: 1 1 150px; max-width: 200px; }
.filter-box label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase;}
.filter-box select, .filter-box input {
  padding: 10px; border: 1px solid var(--border-color);
  font-size: 13px; background: #000; color: white; outline: none; border-radius: 0;
}
.filter-box select:focus, .filter-box input:focus { border-color: var(--primary); }

/* ===== PRODUCTS GRID ===== */
.products-section { padding: 40px 30px; }
.section-title {
  text-align: center; font-size: 2rem; font-family: var(--font-head);
  margin-bottom: 40px; color: white; letter-spacing: 2px;
}
.section-title span { color: var(--primary); }

.products-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 30px;
}

.product-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  cursor: pointer;
  transition: var(--transition);
  position: relative;
}
.product-card:hover {
  border-color: var(--primary);
  transform: translateY(-5px);
  box-shadow: 0 15px 30px rgba(0,0,0,0.5);
}

.product-image {
  position: relative;
  height: 280px;
  background: #000;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.product-image img {
  width: 100%; height: 100%; object-fit: cover;
  position: absolute; top:0; left:0;
  opacity: 0; transition: opacity 0.8s ease-in-out, transform 3s ease;
}
.product-image img.active { opacity: 1; transform: scale(1.03); }

.product-badge {
  position: absolute; top: 15px; right: 15px;
  background: var(--primary); color: #000;
  padding: 4px 12px; font-size: 0.7rem; font-weight: 700; font-family: var(--font-head);
  text-transform: uppercase; z-index: 10;
}

.image-counter {
  position: absolute; bottom: 10px; right: 10px;
  background: rgba(0,0,0,0.8); color: var(--text-light);
  font-size: 10px; padding: 3px 8px; z-index: 10;
}

.product-info { padding: 20px; text-align: center; }
.product-title {
  font-size: 1.2rem; font-family: var(--font-head); color: white;
  margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px;
}
.product-meta {
  display: flex; justify-content: center; gap: 15px;
  font-size: 0.8rem; color: var(--text-muted);
}
.product-meta span { display: flex; align-items: center; gap: 5px; }

/* ===== MODALS ===== */
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); justify-content: center; align-items: center; z-index: 2000; }
.modal.active { display: flex; }
.modal-content { background: var(--bg-card); border: 1px solid var(--border-color); padding: 40px; width: 400px; max-width: 90vw; position: relative; }
.modal-content h2 { color: white; margin-bottom: 25px; font-size: 1.8rem; text-align: center; font-family: var(--font-head); }
.form-group { margin-bottom: 20px; }
.form-group input { width: 100%; padding: 12px 15px; background: #000; border: 1px solid var(--border-color); color: white; font-size: 13px; outline: none; }
.form-group input:focus { border-color: var(--primary); }
.modal-close { position: absolute; top: 15px; right: 15px; font-size: 24px; color: var(--text-muted); background: none; border: none; cursor: pointer; }
.modal-close:hover { color: var(--primary); }
.modal a { color: var(--primary); display: block; text-align: center; margin-top: 15px; font-size: 0.85rem; text-decoration: none; }

/* ===== FOOTER ===== */
footer {
  background: #000; border-top: 1px solid var(--border-color);
  color: var(--text-muted); text-align: center; padding: 25px;
  font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;
}
footer a { color: var(--primary); text-decoration: none; }

/* ===== RESPONSIVE ===== */
@media (max-width: 992px) {
  .nav-links {
    position: fixed; top: 70px; left: -100%; width: 250px; height: calc(100vh - 70px);
    background: var(--bg-card); flex-direction: column; gap: 0;
    border-right: 1px solid var(--border-color); transition: var(--transition);
  }
  .nav-links.active { left: 0; }
  .nav-links a { padding: 20px; border-bottom: 1px solid var(--border-color); }
  .mobile-toggle { display: block; }
  .nav-brand span.text { display: none; }
  .highlight-item { width: 220px; height: 300px; }
}
@media (max-width: 576px) {
  .top-navbar { padding: 0 15px; }
  .btn-outline, .btn-primary { padding: 6px 12px; font-size: 0.75rem; }
  .user-name { display: none; }
  .products-section { padding: 30px 15px; }
}
</style>
</head>

<script type="module">
import { db, auth } from './firebase-config.js';
import { collection, getDocs } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

let products = [];

// Mobile Menu Toggle
document.getElementById('mobile-toggle').addEventListener('click', () => {
  document.getElementById('nav-links').classList.toggle('active');
});

// Modals Setup
function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }
document.getElementById('btn-open-signin').onclick = () => openModal('signin-modal');
document.querySelectorAll('.modal-close').forEach(btn => btn.onclick = function() { closeModal(this.closest('.modal').id); });
document.getElementById('switch-to-signup').onclick = (e) => { e.preventDefault(); closeModal('signin-modal'); openModal('signup-modal'); };
document.getElementById('switch-to-signin').onclick = (e) => { e.preventDefault(); closeModal('signup-modal'); openModal('signin-modal'); };

// Filters Toggle
document.getElementById('filter-toggle-btn').onclick = function() {
  document.getElementById('filter-container').classList.toggle('active');
};

// Render Products (No Prices, No Buy Buttons, Fully Clickable)
window.renderProducts = function(productsToRender) {
  const grid = document.getElementById('product-grid');
  grid.innerHTML = '';
  
  if (productsToRender.length === 0) { 
    grid.innerHTML = '<div style="color:var(--text-muted); grid-column:1/-1; text-align:center;">NO INVENTORY MATCHES FOUND</div>'; 
    return; 
  }
  
  // Save for details page
  localStorage.setItem('stoneProducts', JSON.stringify(productsToRender));
  
  productsToRender.forEach(product => {
    // Generate image HTML (all images stacked, first is active)
    let imagesHtml = '';
    if (product.images && product.images.length > 0) {
      imagesHtml = product.images.map((img, idx) => 
        `<img src="${img}" class="card-img ${idx === 0 ? 'active' : ''}" alt="stone">`
      ).join('');
    } else {
      imagesHtml = `<img src="stone-placeholder.png" class="card-img active" alt="stone">`;
    }

    let counterHtml = (product.images && product.images.length > 1) ? 
      `<div class="image-counter">1 / ${product.images.length}</div>` : '';

    grid.innerHTML += `
      <div class="product-card" onclick="window.location.href='product-details.html?id=${product.id}'">
        <div class="product-image">
          ${imagesHtml}
          <span class="product-badge">${product.category || 'STONE'}</span>
          ${counterHtml}
        </div>
        <div class="product-info">
          <h3 class="product-title">${product.stone_name || 'PREMIUM STONE'}</h3>
          <div class="product-meta">
            <span><i class="fas fa-layer-group"></i> ${product.sub_category || '-'}</span>
            <span><i class="fas fa-fill-drip"></i> ${product.color || '-'}</span>
          </div>
        </div>
      </div>
    `;
  });
}

// Auto-Play Image Carousel for Cards
setInterval(() => {
  document.querySelectorAll('.product-image').forEach(container => {
    const imgs = container.querySelectorAll('.card-img');
    if (imgs.length > 1) {
      const counter = container.querySelector('.image-counter');
      let curr = Array.from(imgs).findIndex(img => img.classList.contains('active'));
      
      imgs[curr].classList.remove('active');
      let next = (curr + 1) % imgs.length;
      imgs[next].classList.add('active');
      
      if (counter) counter.textContent = `${next + 1} / ${imgs.length}`;
    }
  });
}, 3000); // Changes image every 3 seconds

// Load Data
async function loadProducts() {
  try {
    const snap = await getDocs(collection(db, "products"));
    snap.forEach(doc => products.push({id: doc.id, ...doc.data()}));
    renderProducts(products);
  } catch (e) {
    console.error("Database error, showing fallbacks.", e);
    // Fallback data if DB fails
    products = [
      { id: '1', stone_name: "RAJ GREEN", category: "SANDSTONE", color: "GREEN", images: ["https://images.unsplash.com/photo-1582735689362-4b5b9ca0b787?ixlib=rb-4.0.3", "https://images.unsplash.com/photo-1582735689272-29b68d399c1c?ixlib=rb-4.0.3"] },
      { id: '2', stone_name: "KOTA BROWN", category: "KOTA", color: "BROWN", images: ["https://images.unsplash.com/photo-1541888946425-d81bb19240f5?ixlib=rb-4.0.3"] }
    ];
    renderProducts(products);
  }
}
loadProducts();
</script>
